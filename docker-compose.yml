services:
  postgres:
    image: postgres:16-alpine
    container_name: baho-postgres
    environment:
      POSTGRES_DB: baho
      POSTGRES_USER: fle
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - baho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fle -d baho"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: baho-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://fle:postgres@postgres:5432/baho
      AUTH_TOKEN_SECRET: local-docker-demo-secret-change-before-hosting
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  baho_pgdata:
