<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="780" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Baho system architecture</text>
<text x="40" y="74" font-size="14" fill="#64748b">Three tiers: installable web app (PWA) → REST API → PostgreSQL. Sensitive health answers never leave the device.</text>
<rect x="40" y="110" width="250" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="56" y="138" font-size="17" font-weight="700" fill="#0f172a">Users</text>
<text x="56" y="162" font-size="13" fill="#334155">Learner (phone, Chrome Android)</text>
<text x="56" y="182" font-size="13" fill="#334155">Creator: health professional</text>
<text x="56" y="202" font-size="13" fill="#334155">Admin (laptop browser)</text>
<rect x="330" y="100" width="420" height="645" rx="18" fill="#ecfdf5" stroke="#147764" stroke-width="2.5"/>
<text x="350" y="132" font-size="20" font-weight="700" fill="#14532d">Client: React + TypeScript PWA (Vite)</text>
<rect x="350" y="150" width="380" height="130" rx="14" fill="#ffffff" stroke="#147764" stroke-width="2"/>
<text x="366" y="178" font-size="15" font-weight="700" fill="#0f172a">Presentation (components/screens)</text>
<text x="366" y="202" font-size="13" fill="#334155">Landing, onboarding, health profile, dashboard</text>
<text x="366" y="222" font-size="13" fill="#334155">Lessons + audio player + quiz, NCD module</text>
<text x="366" y="242" font-size="13" fill="#334155">Exercises, reminders, help/FAQ, staff area</text>
<text x="366" y="262" font-size="13" fill="#334155">Responsive: bottom nav on phones, top nav on laptops</text>
<rect x="350" y="295" width="380" height="105" rx="14" fill="#ffffff" stroke="#147764" stroke-width="2"/>
<text x="366" y="323" font-size="15" font-weight="700" fill="#0f172a">State + logic</text>
<text x="366" y="347" font-size="13" fill="#334155">Redux Toolkit store (store/appSlice.ts)</text>
<text x="366" y="367" font-size="13" fill="#334155">Rules-based ranking + learning paths (lib/)</text>
<text x="366" y="387" font-size="13" fill="#334155">API client with JWT-style bearer token</text>
<rect x="350" y="410" width="380" height="155" rx="14" fill="#ffffff" stroke="#147764" stroke-width="2"/>
<text x="366" y="438" font-size="15" font-weight="700" fill="#0f172a">Local data layer (offline-first)</text>
<text x="366" y="462" font-size="13" fill="#334155">Service worker (public/sw.js): app shell, images, audio</text>
<text x="366" y="482" font-size="13" fill="#334155">localStorage: cached lessons, FAQs, paths, progress</text>
<text x="366" y="502" font-size="13" fill="#334155">Outbox: issue reports queued while offline</text>
<text x="366" y="522" font-size="13" fill="#334155">IndexedDB + Web Crypto AES-GCM (non-extractable key):</text>
<text x="366" y="542" font-size="13" fill="#334155">   encrypted health profile, never sent to server</text>
<rect x="350" y="585" width="380" height="140" rx="14" fill="#ffffff" stroke="#147764" stroke-width="2"/>
<text x="366" y="613" font-size="15" font-weight="700" fill="#0f172a">Browser APIs</text>
<text x="366" y="637" font-size="13" fill="#334155">Web Speech API: Kinyarwanda/Swahili voice fallback</text>
<text x="366" y="657" font-size="13" fill="#334155">HTML5 Audio: recorded MP3 lessons</text>
<text x="366" y="677" font-size="13" fill="#334155">Notifications API: reminders</text>
<text x="366" y="697" font-size="13" fill="#334155">Web App Manifest: install to home screen</text>
<rect x="830" y="100" width="300" height="470" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="850" y="132" font-size="20" font-weight="700" fill="#1e3a8a">Server: Node.js + Express</text>
<rect x="850" y="150" width="260" height="110" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<text x="866" y="178" font-size="15" font-weight="700" fill="#0f172a">Middleware</text>
<text x="866" y="202" font-size="13" fill="#334155">CORS, JSON body parser</text>
<text x="866" y="222" font-size="13" fill="#334155">authenticate: signed token (HMAC)</text>
<text x="866" y="242" font-size="13" fill="#334155">requireRole(admin | creator)</text>
<rect x="850" y="275" width="260" height="175" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<text x="866" y="303" font-size="15" font-weight="700" fill="#0f172a">Modules (/api/v1)</text>
<text x="866" y="327" font-size="13" fill="#334155">auth: register, login, staff</text>
<text x="866" y="347" font-size="13" fill="#334155">content: lessons, FAQ, review</text>
<text x="866" y="367" font-size="13" fill="#334155">learning: paths, diseases, quizzes</text>
<text x="866" y="387" font-size="13" fill="#334155">progress: completion, quiz scores</text>
<text x="866" y="407" font-size="13" fill="#334155">questions, issues, reminders</text>
<text x="866" y="427" font-size="13" fill="#334155">health</text>
<rect x="850" y="465" width="260" height="90" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
<text x="866" y="493" font-size="15" font-weight="700" fill="#0f172a">Data access</text>
<text x="866" y="517" font-size="13" fill="#334155">pg connection pool</text>
<text x="866" y="537" font-size="13" fill="#334155">In-memory demo store if DB down</text>
<rect x="1170" y="150" width="200" height="260" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="1186" y="178" font-size="17" font-weight="700" fill="#0f172a">PostgreSQL</text>
<text x="1186" y="202" font-size="13" fill="#334155">13 tables</text>
<text x="1186" y="222" font-size="13" fill="#334155">users, staff</text>
<text x="1186" y="242" font-size="13" fill="#334155">categories, content</text>
<text x="1186" y="262" font-size="13" fill="#334155">curricula,</text>
<text x="1186" y="282" font-size="13" fill="#334155">curriculum_lessons</text>
<text x="1186" y="302" font-size="13" fill="#334155">quiz_questions,</text>
<text x="1186" y="322" font-size="13" fill="#334155">quiz_attempts, progress</text>
<text x="1186" y="342" font-size="13" fill="#334155">questions, issues,</text>
<text x="1186" y="362" font-size="13" fill="#334155">reminders, faqs</text>
<rect x="830" y="600" width="540" height="140" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="846" y="628" font-size="17" font-weight="700" fill="#0f172a">Deployment plan</text>
<text x="846" y="652" font-size="13" fill="#334155">Frontend: static build (npm run build) on Vercel or Netlify, HTTPS</text>
<text x="846" y="672" font-size="13" fill="#334155">Backend: Docker image on Render or Railway (Dockerfile in /backend)</text>
<text x="846" y="692" font-size="13" fill="#334155">Database: managed PostgreSQL (Render, Railway or Neon)</text>
<text x="846" y="712" font-size="13" fill="#334155">Local: docker compose up (API + PostgreSQL)</text>
<path d="M290 165 H325" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<path d="M750 300 H825" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="757" y="290" font-size="12" fill="#475569">HTTPS</text><text x="757" y="320" font-size="12" fill="#475569">REST/JSON</text>
<path d="M1130 280 H1165" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="1133" y="270" font-size="12" fill="#475569">SQL</text>
</svg>