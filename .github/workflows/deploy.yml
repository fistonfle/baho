# Runs the tests, builds the images and deploys to the VM on every push to main.
# Needs the VM_HOST, VM_SSH_PORT, VM_USER and VM_SSH_KEY secrets.
name: Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time, otherwise two quick pushes clash on container names.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_DIR: /app/baho

jobs:
  test:
    name: Tests and build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend tests (demo mode, no database)
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend unit tests, type check and build
        working-directory: frontend
        run: npm ci && npm test && npm run build

  build:
    name: Build ${{ matrix.part }} image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [backend, frontend, tts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.part }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/baho-${{ matrix.part }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/baho-${{ matrix.part }}:latest

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the app folder exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_SSH_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p ${{ env.APP_DIR }}

      - name: Copy the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_SSH_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/docker-compose.production.yml
          target: ${{ env.APP_DIR }}/
          strip_components: 1

      - name: Pull the new images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_SSH_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          command_timeout: 20m
          script: |
            set -e
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env. Create it from deploy/.env.production.example first."
              exit 1
            fi

            # Separate docker login so the other stacks on the VM keep theirs.
            export DOCKER_CONFIG="$APP_DIR/.docker"
            mkdir -p "$DOCKER_CONFIG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE_TAG
            # Every deploy pulls three images tagged with the commit, so the ones from
            # older deploys have to go or the disk fills and the next pull fails.
            echo "Disk before the pull:"; df -h "$APP_DIR" | tail -1
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '/baho-(backend|frontend|tts):' \
              | grep -v ":$IMAGE_TAG$" | grep -v ':latest$' \
              | xargs -r -n1 docker rmi -f >/dev/null 2>&1 || true
            # Dangling layers only, so the other stacks on the VM keep their images.
            docker image prune -f >/dev/null 2>&1 || true
            echo "Disk after the clean-up:"; df -h "$APP_DIR" | tail -1

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            docker logout ghcr.io >/dev/null 2>&1 || true
            docker compose -f docker-compose.production.yml ps

            echo "Waiting for the API..."
            for i in $(seq 1 30); do
              health=$(docker exec baho-backend wget -qO- http://localhost:4000/api/v1/health 2>/dev/null || true)
              case "$health" in
                *postgres-connected*) echo "Baho is up: $health"; exit 0 ;;
              esac
              sleep 3
            done
            echo "The API did not report a database connection in 90 seconds."
            docker logs --tail 60 baho-backend
            exit 1
