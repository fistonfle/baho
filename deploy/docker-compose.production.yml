# Baho on the shared VM behind Caddy. All names start with baho to avoid clashes.
# Only backend and frontend join the Caddy network.
name: baho

services:
  postgres:
    image: postgres:16-alpine
    container_name: baho-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baho}
      POSTGRES_USER: ${POSTGRES_USER:-baho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - baho_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baho} -d ${POSTGRES_DB:-baho}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  baho-backend:
    image: ghcr.io/fistonfle/baho-backend:${IMAGE_TAG:-latest}
    container_name: baho-backend
    restart: unless-stopped
    mem_limit: 512m
    expose:
      - "4000"
    env_file:
      - .env
    volumes:
      - baho_media:/app/uploads
    environment:
      PORT: 4000
      MEDIA_DIR: /app/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:-baho}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baho}
      # Named here, not in .env: the voice is part of this stack or it is absent.
      TTS_URL: ${TTS_URL-http://baho-tts:8080/speak}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - caddy

  # Reads a lesson aloud when nobody can record it; nothing else depends on it.
  baho-tts:
    image: ghcr.io/fistonfle/baho-tts:${IMAGE_TAG:-latest}
    container_name: baho-tts
    restart: unless-stopped
    mem_limit: 768m
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - default

  baho-frontend:
    image: ghcr.io/fistonfle/baho-frontend:${IMAGE_TAG:-latest}
    container_name: baho-frontend
    restart: unless-stopped
    mem_limit: 128m
    expose:
      - "80"
    networks:
      - caddy

volumes:
  baho_pg_data:
  # Lesson recordings uploaded by staff.
  baho_media:

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-sagamba-net}
