server {
    listen 80;
    root /usr/share/nginx/html;

    # Built files have a content hash in their name, so they can be kept for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the page must always be checked again, or phones keep an old version.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Single-page app: unknown paths load the app.
    location / {
        try_files $uri /index.html;
    }
}
